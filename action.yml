name: 'Flare Security Changelog'
description: 'Weekly AI-synthesized cloud security summary delivered as a GitHub Issue and committed Markdown'
author: 'Flare AI'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  token:
    description: 'Flare webhook token (flr_...) from your connector settings'
    required: true
  period:
    description: 'Analysis period: "7d" for weekly or "1d" for daily'
    required: false
    default: '7d'
  api-url:
    description: 'Flare API base URL'
    required: false
    default: 'https://www.tryflare.ai'
  changelog-path:
    description: 'Path to the changelog Markdown file in your repository'
    required: false
    default: 'SECURITY-CHANGELOG.md'
  json-path:
    description: 'Path to the structured JSON changelog file'
    required: false
    default: 'security-changelog.json'
  create-issue:
    description: 'Create a GitHub Issue with the changelog summary'
    required: false
    default: 'true'

outputs:
  risk-score:
    description: 'Risk score from 0-10 assigned by the analysis'
    value: ${{ steps.changelog.outputs.risk-score }}
  total-events:
    description: 'Total audit log events analyzed'
    value: ${{ steps.changelog.outputs.total-events }}
  issue-url:
    description: 'URL of the created GitHub Issue (if create-issue is true)'
    value: ${{ steps.issue.outputs.issue-url }}

runs:
  using: 'composite'
  # Expressions are passed only through each step's environment and referenced
  # as quoted shell variables; never interpolate ${{ }} into a script body.
  steps:
    - name: Read prior changelog
      id: prior
      shell: bash
      env:
        JSON_PATH: ${{ inputs.json-path }}
      run: |
        set -euo pipefail
        PRIOR_FILE="$RUNNER_TEMP/flare-prior-changelog.json"
        if [ -f "$JSON_PATH" ]; then
          echo "has_prior=true" >> "$GITHUB_OUTPUT"
          cat "$JSON_PATH" > "$PRIOR_FILE"
        else
          echo "has_prior=false" >> "$GITHUB_OUTPUT"
          echo '{}' > "$PRIOR_FILE"
        fi

    - name: Call Flare changelog API
      id: changelog
      shell: bash
      env:
        FLARE_TOKEN: ${{ inputs.token }}
        FLARE_API_URL: ${{ inputs.api-url }}
        PERIOD: ${{ inputs.period }}
        HAS_PRIOR: ${{ steps.prior.outputs.has_prior }}
      run: |
        set -euo pipefail
        PRIOR_FILE="$RUNNER_TEMP/flare-prior-changelog.json"
        RESPONSE_FILE="$RUNNER_TEMP/flare-changelog-response.json"
        BODY_FILE="$RUNNER_TEMP/flare-changelog-request.json"

        if [ -z "$FLARE_TOKEN" ]; then
          echo "::error::Flare: no webhook token provided. Set the token input (for example from secrets.FLARE_WEBHOOK_TOKEN)."
          exit 1
        fi
        echo "::add-mask::$FLARE_TOKEN"

        # Build request body
        if [ "$HAS_PRIOR" = "true" ]; then
          jq -n \
            --arg period "$PERIOD" \
            --slurpfile prior "$PRIOR_FILE" \
            '{period: $period, prior_changelog: $prior[0]}' > "$BODY_FILE"
        else
          jq -n --arg period "$PERIOD" '{period: $period}' > "$BODY_FILE"
        fi

        # Call the API
        HTTP_CODE=$(curl -sS -w '%{http_code}' -o "$RESPONSE_FILE" \
          -X POST "${FLARE_API_URL%/}/api/webhooks/changelog" \
          -H "Authorization: Bearer $FLARE_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @"$BODY_FILE" \
          --max-time 150) || HTTP_CODE="000"

        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Flare API returned HTTP $HTTP_CODE"
          cat "$RESPONSE_FILE" 2>/dev/null || true
          exit 1
        fi

        # Extract outputs
        RISK_SCORE=$(jq -r '.json.risk_score' "$RESPONSE_FILE")
        TOTAL_EVENTS=$(jq -r '.metadata.total_logs' "$RESPONSE_FILE")
        SAMPLED=$(jq -r '.metadata.sampled' "$RESPONSE_FILE")
        if [ "$SAMPLED" = "true" ]; then
          TOTAL_EVENTS="${TOTAL_EVENTS}+"
        fi
        echo "risk-score=$RISK_SCORE" >> "$GITHUB_OUTPUT"
        echo "total-events=$TOTAL_EVENTS" >> "$GITHUB_OUTPUT"

    - name: Update changelog files
      shell: bash
      env:
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        JSON_PATH: ${{ inputs.json-path }}
      run: |
        set -euo pipefail
        RESPONSE_FILE="$RUNNER_TEMP/flare-changelog-response.json"
        MARKDOWN=$(jq -r '.markdown' "$RESPONSE_FILE")

        # Write/prepend to the changelog file
        if [ -f "$CHANGELOG_PATH" ]; then
          EXISTING=$(cat "$CHANGELOG_PATH")
          printf '%s\n\n---\n\n%s' "$MARKDOWN" "$EXISTING" > "$CHANGELOG_PATH"
        else
          printf '# Security Changelog\n\nAI-generated cloud security summaries by [Flare](https://tryflare.ai).\n\n---\n\n%s\n' "$MARKDOWN" > "$CHANGELOG_PATH"
        fi

        # Write structured JSON (overwrite -- latest week only; history is in git)
        jq '.json' "$RESPONSE_FILE" > "$JSON_PATH"

    - name: Commit changelog
      shell: bash
      env:
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        JSON_PATH: ${{ inputs.json-path }}
        PERIOD: ${{ inputs.period }}
      run: |
        set -uo pipefail
        RESPONSE_FILE="$RUNNER_TEMP/flare-changelog-response.json"
        git config user.name "flare-ai[bot]"
        git config user.email "flare-ai[bot]@users.noreply.github.com"
        git add -- "$CHANGELOG_PATH" "$JSON_PATH"

        if [ "$PERIOD" = "7d" ]; then
          PERIOD_LABEL="weekly"
        else
          PERIOD_LABEL="daily"
        fi

        RISK_SCORE=$(jq -r '.json.risk_score' "$RESPONSE_FILE")
        git commit -m "security: ${PERIOD_LABEL} changelog (risk: ${RISK_SCORE}/10)" || echo "No changes to commit"
        git push || echo "::warning::Could not push changes. Ensure the workflow has write permissions."

    - name: Create GitHub Issue
      id: issue
      if: inputs.create-issue == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        RESPONSE_FILE="$RUNNER_TEMP/flare-changelog-response.json"
        RISK_SCORE=$(jq -r '.json.risk_score' "$RESPONSE_FILE")
        TOTAL_EVENTS=$(jq -r '.metadata.total_logs' "$RESPONSE_FILE")
        PERIOD_START=$(jq -r '.json.period.start' "$RESPONSE_FILE" | cut -dT -f1)
        PERIOD_END=$(jq -r '.json.period.end' "$RESPONSE_FILE" | cut -dT -f1)
        MARKDOWN=$(jq -r '.markdown' "$RESPONSE_FILE")

        # Determine risk label (awk: portable, tolerates non-numeric scores)
        RISK_LABEL=$(awk -v s="$RISK_SCORE" 'BEGIN { if (s + 0 >= 7) print "HIGH RISK"; else if (s + 0 >= 4) print "ELEVATED"; else print "LOW RISK" }')

        TITLE="Security Changelog: ${PERIOD_START} to ${PERIOD_END} [${RISK_LABEL}]"

        BODY=$(printf '%s\n\n---\n\n**Risk Score:** %s/10 | **Events Analyzed:** %s | **Generated by [Flare](https://tryflare.ai)' "$MARKDOWN" "$RISK_SCORE" "$TOTAL_EVENTS")

        ISSUE_URL=$(gh issue create --repo "$REPO" \
          --title "$TITLE" \
          --body "$BODY" \
          --label "security-changelog" 2>/dev/null || \
          gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" 2>/dev/null) || ISSUE_URL=""

        if [ -n "$ISSUE_URL" ]; then
          echo "issue-url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
          echo "Created issue: $ISSUE_URL"
        else
          echo "::warning::Could not create GitHub Issue. Ensure the workflow has issues:write permission."
        fi

    - name: Cleanup
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/flare-changelog-response.json" "$RUNNER_TEMP/flare-prior-changelog.json" "$RUNNER_TEMP/flare-changelog-request.json"
